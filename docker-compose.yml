services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qobuz-backend
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    networks:
      - qobuz_net
    volumes:
      # Mount the host qobuz-cli config (writable for archive db and cache)
      - ${HOME}/.config/qobuz-cli:/config/.config/qobuz-cli
      # Downloads go to the path defined in .env (MUSIC_DIR)
      - ${MUSIC_DIR}:/downloads
      # Mount backend code for hot reloading/real-time updates
      - ./backend:/app
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - DOWNLOAD_DIR=/downloads
      - QOBUZ_CONFIG=/config/.config/qobuz-cli/config.ini
      - HOME=/config
      - APP_USERNAME=${APP_USERNAME:-}
      - APP_PASSWORD=${APP_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-}


  frontend:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: qobuz-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT}:8085"
    depends_on:
      - backend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - qobuz_net

  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    container_name: qobuz-mcp
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-8086}:8086"
    depends_on:
      - backend
    environment:
      - QOBUZ_API_URL=http://backend:8000/api
      - MCP_TOKEN=${MCP_TOKEN}
      - PORT=8086
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - APP_USERNAME=${APP_USERNAME:-}
      - APP_PASSWORD=${APP_PASSWORD:-}
    networks:
      - qobuz_net

networks:
  qobuz_net:
