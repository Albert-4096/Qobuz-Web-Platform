services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qobuz-backend
    restart: unless-stopped
    networks:
      - qobuz_net
    volumes:
      # Mount the host qobuz-cli config (read-only)
      - ${HOME}/.config/qobuz-cli:/root/.config/qobuz-cli:ro
      # Downloads go to the path defined in .env (MUSIC_DIR)
      - ${MUSIC_DIR}:/downloads
      # Mount backend code for hot reloading/real-time updates
      - ./backend:/app
    environment:
      - DOWNLOAD_DIR=/downloads
      - QOBUZ_CONFIG=/root/.config/qobuz-cli/config.ini


  frontend:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: qobuz-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT}:8085"
    depends_on:
      - backend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - qobuz_net

networks:
  qobuz_net:
